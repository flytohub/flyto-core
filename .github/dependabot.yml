version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 disables version-update PRs. Every merge freed a slot under the old
    # limit of 10 and Dependabot refilled it at once, so merging never drained
    # the queue. Security updates are a separate repository setting and are
    # not affected by this line.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
