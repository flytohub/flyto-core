name: Optional IoT Ecosystem Adapters

on:
  pull_request:
    paths:
      - "examples/integrations/**"
      - "scripts/generate_reference.py"
      - ".github/workflows/iot-ecosystems.yml"
  push:
    branches: [main]
    paths:
      - "examples/integrations/**"
      - "scripts/generate_reference.py"
      - ".github/workflows/iot-ecosystems.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-external-adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install Core and optional integration package
        run: |
          python -m pip install 'setuptools>=69' wheel ruff pytest
          python -m pip install -e .
          python -m pip install -e ./examples/integrations
      - name: Verify external adapter policy, registry and no-replay regressions
        run: python -m pytest -o addopts='' examples/integrations/tests -q
      - name: Lint external package
        run: ruff check examples/integrations scripts/generate_reference.py
      - name: Validate independent distribution wheel
        run: python -m pip wheel ./examples/integrations --no-deps --no-build-isolation --wheel-dir /tmp/flyto-iot-wheels
