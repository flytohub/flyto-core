name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, Lint, Build, Verify
    runs-on: ubuntu-latest

    steps:
      # `fetch-tags` because the release-drift check below compares HEAD against
      # the tag the declared version names; without tag history it cannot tell
      # "unreleased version" from "version that already shipped other code".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Pinned, not floating. The verify gate below is only reproducible if the
      # tool running it is: without a `ref` this took whatever was on the
      # Indexer's default branch at run time, so an unrelated Indexer commit
      # could turn this repository red -- or green -- with nothing changed here,
      # and a green local run proved nothing about the next CI run. This is the
      # same revision `flyto-ai/stack-lock.json` pins for the shared stack.
      - uses: actions/checkout@v4
        with:
          repository: flytohub/flyto-indexer
          ref: 0dbae85669a04c1e2ebf0dde4a02597926ae88fd
          path: flyto-indexer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install package and audit tooling
        run: |
          # pip-tools 7.6.0 is incompatible with pip 26.2.
          # The packaging regression test builds without isolation, so keep the
          # runner's build backend aligned with pyproject.toml too.
          python -m pip install --upgrade 'pip>=26.1.2,<26.2' 'setuptools>=83.0.0'
          pip install -e '.[dev,browser]'
          pip install './flyto-indexer[dev]'
          npm ci --ignore-scripts

      - name: Check release drift
        run: python scripts/check_release_drift.py

      - name: Check documentation and project memory
        run: |
          bash scripts/lint-project-memory.sh
          bash scripts/lock-deps.sh
          git diff --exit-code -- requirements.lock
          python -m pip_audit -r requirements.lock
          python scripts/check_documentation.py
          python scripts/check_brand_identity.py

      - name: Lint audited maintenance and security surfaces
        run: |
          ruff check \
            scripts/generate_catalog.py \
            scripts/generate_reference.py \
            scripts/check_documentation.py \
            scripts/check_brand_identity.py \
            src/cli/__init__.py \
            src/cli/config.py \
            src/core/constants.py \
            src/core/api/routes/workflows.py \
            src/core/modules/atomic/crypto/encrypt.py \
            src/core/modules/atomic/crypto/decrypt.py \
            src/core/modules/atomic/crypto/jwt_create.py \
            src/core/modules/atomic/crypto/jwt_verify.py \
            src/core/modules/atomic/dns/lookup.py \
            tests/conftest.py \
            tests/test_documentation_generators.py \
            tests/test_version_identity.py \
            tests/core/api/test_routes.py

      - name: Run non-browser test suite
        run: pytest -m 'not browser and not e2e'

      - name: Audit JavaScript test runtime
        run: npm run audit

      - name: Audit reverse.deobfuscate's Node.js worker
        run: |
          npm ci --ignore-scripts --prefix src/core/modules/atomic/reverse/deobfuscate_worker
          npm run audit --prefix src/core/modules/atomic/reverse/deobfuscate_worker

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Run Flyto2 verify gate
        run: flyto-index verify . --full-scan --strict --json

  # Everything above runs once, on 3.11, because it is the heavy job: npm
  # audits, package build, documentation and the full-scan verify gate do not
  # get more truthful by being repeated per interpreter. What does need
  # repeating is the claim `requires-python` makes. That claim went unchecked
  # long enough to become false -- the floor said 3.9 while `aiohttp>=3.14.3`
  # cannot install below 3.10 -- so this job proves every version in the
  # declared range can install the package and pass the suite, rather than
  # leaving the range as an assertion no run ever tested.
  compat:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Part of the test environment, not an extra audit. `tests/test_hints.py`
      # runs its DOM assertions through a Node subprocess that requires `jsdom`
      # from the repository-root `node_modules`; without this the suite reports
      # 62 Node module-resolution errors that have nothing to do with the
      # interpreter this job exists to test.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install package
        run: |
          python -m pip install --upgrade 'pip>=26.1.2,<26.2' 'setuptools>=83.0.0'
          pip install -e '.[dev,browser]'
          npm ci --ignore-scripts

      # Same selection as the 3.11 job. Browser and e2e stay out: they need a
      # provisioned browser, and this job exists to answer "does the declared
      # interpreter range work", not to widen coverage.
      - name: Run non-browser test suite
        run: pytest -m 'not browser and not e2e'
